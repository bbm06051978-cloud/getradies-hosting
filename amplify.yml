# Stripe keys configured Aug 2026
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        - echo "DIRECT_URL=$DIRECT_URL" >> .env
        - npx prisma generate
    build:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "DIRECT_URL=$DIRECT_URL" >> .env.production
        - echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env.production
        - echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .env.production
        - echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> .env.production
        - echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" >> .env.production
        - echo "JWT_SECRET=$JWT_SECRET" >> .env.production
        - echo "GETRADIE_S3_KEY_ID=$GETRADIE_S3_KEY_ID" >> .env.production
        - echo "GETRADIE_S3_SECRET=$GETRADIE_S3_SECRET" >> .env.production
        - echo "GETRADIE_S3_REGION=$GETRADIE_S3_REGION" >> .env.production
        - echo "GETRADIE_S3_BUCKET=$GETRADIE_S3_BUCKET" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*